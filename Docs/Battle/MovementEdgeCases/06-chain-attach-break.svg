<text x="16.0" y="331.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Also breaks when a troop routs (both its links), and on a player order outside the envelope (next diagram).</text>
<text x="16.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">A broken, stretched end relaxes back to L_nat at 2 units/s instead of snapping.</text>
