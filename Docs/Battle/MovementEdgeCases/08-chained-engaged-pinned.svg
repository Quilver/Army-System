<text x="420.0" y="160.0" font-size="11" text-anchor="start" font-weight="normal" fill="#d9901a">spring tension on B only</text>
<text x="420.0" y="260.0" font-size="11" text-anchor="start" font-weight="normal" fill="#d6453a">link snaps at 3.0 x L_nat or 65 deg</text>
<text x="420.0" y="274.0" font-size="11" text-anchor="start" font-weight="normal" fill="#d6453a">instead of dragging A out of melee</text>
<text x="16.0" y="331.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Shared retreat: when a troop retreats d, each unengaged neighbour retreats too if its stretch &gt; 1.4 x L_nat or its</text>
<text x="16.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">hinge bends &gt; 30 deg, passing on 70% per hop. Engaged neighbours never retreat sympathetically.</text>
