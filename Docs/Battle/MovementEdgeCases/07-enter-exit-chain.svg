<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4a"/></marker></defs>
<rect width="640" height="360" fill="#fbfaf6"/>
<text x="16" y="26" font-size="16" font-weight="bold" fill="#222">07 Ordering a chained troop</text>
<text x="16" y="44" font-size="12" fill="#555">Inside the envelope it stays linked; outside, the link breaks on release (spec 6.3)</text>
<line x1="45.0" y1="100.0" x2="175.0" y2="100.0" stroke="#3b6fd8" stroke-width="5"/>
<text x="110.0" y="88.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#3b6fd8">A</text>
<line x1="185.0" y1="100.0" x2="315.0" y2="100.0" stroke="#3b6fd8" stroke-width="5"/>
<text x="250.0" y="88.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#3b6fd8">B</text>
<line x1="325.0" y1="100.0" x2="455.0" y2="100.0" stroke="#3b6fd8" stroke-width="5"/>
<text x="390.0" y="88.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#3b6fd8">C</text>
<circle cx="180.0" cy="100.0" r="4.0" fill="white" stroke="#222" stroke-width="1.5"/>
<circle cx="320.0" cy="100.0" r="4.0" fill="white" stroke="#222" stroke-width="1.5"/>
<line x1="250.0" y1="112.0" x2="270.0" y2="162.0" stroke="#2e9d4a" stroke-width="2" marker-end="url(#ag)"/>
<text x="280.0" y="166.0" font-size="11" text-anchor="start" font-weight="normal" fill="#2e9d4a">order B a little forward: green tether, stays chained, joints hinge</text>
<line x1="250.0" y1="112.0" x2="250.0" y2="230.0" stroke="#d6453a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="260.0" y="222.0" font-size="11" text-anchor="start" font-weight="normal" fill="#d6453a">order B far away (or hold Alt): dashed red, B unlinks on release</text>
<text x="260.0" y="236.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555">B is ChainSuppressed so it does not re-link while marching past</text>
<text x="110.0" y="272.0" font-size="11" text-anchor="start" font-weight="bold" fill="#222">Middle extraction: A and C keep free inner ends and do NOT link across the gap</text>
<text x="110.0" y="286.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555">(auto-linking only happens within 0.25 x L_nat)</text>
<text x="16.0" y="331.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Envelope: resulting stretch &lt;= 3.0 x L_nat and inner hinge angle &gt;= 65 deg.</text>
<text x="16.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Alt + order on unlinked reserves keeps them from snapping onto a line's wings.</text>
</svg>
