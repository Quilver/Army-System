<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4a"/></marker></defs>
<rect width="640" height="360" fill="#fbfaf6"/>
<text x="16" y="26" font-size="16" font-weight="bold" fill="#222">09 Faces and flanking</text>
<text x="16" y="44" font-size="12" fill="#555">Each opponent attacks one face; penalties apply only to clashes with that opponent (spec 4.8)</text>
<rect x="190.0" y="165.0" width="220.0" height="50.0" rx="0" fill="#3b6fd8" stroke="#3b6fd8" stroke-width="1.5" opacity="0.08"/>
<line x1="190.0" y1="165.0" x2="410.0" y2="165.0" stroke="#3b6fd8" stroke-width="4"/>
<line x1="190.0" y1="215.0" x2="410.0" y2="215.0" stroke="#8a8a8a" stroke-width="4"/>
<line x1="190.0" y1="165.0" x2="190.0" y2="215.0" stroke="#d9901a" stroke-width="4"/>
<line x1="410.0" y1="165.0" x2="410.0" y2="215.0" stroke="#d9901a" stroke-width="4"/>
<text x="292.0" y="157.0" font-size="11" text-anchor="end" font-weight="bold" fill="#3b6fd8">Front (within 45 deg of facing)</text>
<text x="300.0" y="233.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#8a8a8a">Rear (beyond 135 deg)</text>
<text x="182.0" y="194.0" font-size="11" text-anchor="end" font-weight="bold" fill="#d9901a">Left flank</text>
<text x="418.0" y="194.0" font-size="11" text-anchor="start" font-weight="bold" fill="#d9901a">Right flank</text>
<line x1="300.0" y1="190.0" x2="300.0" y2="130.0" stroke="#3b6fd8" stroke-width="1.5" marker-end="url(#ab)"/>
<circle cx="300.0" cy="82.0" r="16.0" fill="none" stroke="#d6453a" stroke-width="1.2"/>
<text x="322.0" y="86.0" font-size="11" text-anchor="start" font-weight="normal" fill="#d6453a">front attacker: normal clashes</text>
<circle cx="560.0" cy="190.0" r="16.0" fill="none" stroke="#d6453a" stroke-width="1.2"/>
<text x="560.0" y="222.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#d6453a">flank attacker</text>
<text x="16.0" y="331.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Against a flank or rear attacker: our soldiers get 0 support in those clashes and damage taken counts x3 Shock.</text>
<text x="16.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Clashes with the front attacker resolve normally at the same time.</text>
</svg>
