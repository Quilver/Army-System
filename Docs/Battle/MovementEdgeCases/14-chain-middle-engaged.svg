<text x="16.0" y="331.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Joint weight: engaged side 1, free side 0, so J stays on B's natural end. If A or C is engaged too, that joint</text>
<text x="16.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">goes to the midpoint and neither side is pulled. Links still break past 3.0 x L_nat or below 65 deg.</text>
