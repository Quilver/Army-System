<text x="430.0" y="246.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#d6453a">Front vs the front enemy; C does not wheel</text>
<text x="16.0" y="331.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Engaged troops never turn, and chain neighbours cannot turn them. Counter by sending a troop at the flanker.</text>
<text x="16.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Open question: should an engaged chain end be able to refuse (wheel back) its flank? Today it cannot.</text>
