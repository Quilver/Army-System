<text x="270.0" y="264.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#8a8a8a">file spacing = line length / files  (never below LineSpacing 0.9)</text>
<text x="16.0" y="316.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Soldiers are sorted along the line each frame and grouped into files of `Ranks` soldiers; each file is pulled to an</text>
<text x="16.0" y="331.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">evenly spaced point. At a linked end the line is pulled in by the joint clearance, so soldiers stay off the joint.</text>
<text x="16.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555">Chargers, followers and retreating soldiers keep their place in the order but are not pulled.</text>
